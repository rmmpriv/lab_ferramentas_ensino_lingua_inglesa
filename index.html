<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>English Learning Games</title>
    <style>
        body { 
    font-family: sans-serif; 
    background-color: #f0f8ff; 
    display: flex; 
    flex-direction: column; 
    align-items: center; 
}
.container { 
    background-color: #ffffff; 
    padding: 30px; 
    border-radius: 15px; 
    text-align: center; 
    margin-top: 20px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
}
button { 
    background-color: #3498db; 
    color: white; 
    padding: 12px 20px; 
    border: none; 
    border-radius: 8px; 
    cursor: pointer; 
    font-weight: bold;
}
.memory-grid { 
    display: grid; 
    grid-template-columns: repeat(4, 100px); 
    gap: 15px; 
    justify-content: center; 
    margin: 20px 0; 
}
.card { 
    background-color: #e74c3c; 
    color: #e74c3c; 
    height: 100px; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 18px; 
    font-weight: bold; 
    border-radius: 8px; 
    cursor: pointer; 
    user-select: none; 
}
.card.flipped { 
    background-color: #ecf0f1; 
    color: #2c3e50; 
    border: 2px solid #bdc3c7; 
}
.card.matched { 
    background-color: #2ecc71; 
    color: white; 
    border: none; 
    pointer-events: none; 
}
.success { color: #2ecc71; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 English Learning Zone</h1>
        
        <div id="game1" class="game-section active">
            <h2>Vocabulary Memory Match</h2>
            <p>Combine a palavra em inglês com sua tradução correta.</p>
            <div class="memory-grid" id="memoryGrid"></div>
            <p class="feedback" id="memoryFeedback"></p>
            <button onclick="initMemoryGame()">Restart Game</button>
        </div>
    </div>

    <script>
        // A inteligência (JavaScript) entrará aqui depois!
    </script>
</body>
</html>
